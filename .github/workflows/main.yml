name: Download NeoForge
on: [workflow_dispatch]

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - run: curl -L -o neoforge-21.1.266-universal.jar https://neoforged.net
      - uses: actions/upload-artifact@v4
        with:
          name: neoforge-universal
          path: neoforge-21.1.266-universal.jar
